<head>
<meta charset="utf-8">

<meta property="og:title" content="T1GO : la montée à la volée avec tes souliers de route">
<meta property="og:description" content="Précommande à 7,99 $ au lieu de 15,99 $. Paiement par virement Interac, livraison mi-décembre 2026.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
  :root {
    --carpet: #1746c7;       /* blue transition-zone carpet */
    --carpet-deep: #0f2f8f;
    --paint: #ffffff;        /* mount-line paint */
    --paper: #f2f4f8;        /* bib paper */
    --asphalt: #23262d;
    --band: #f2b544;         /* rubber band */
    --muted: #596070;
    --rule: #d3d9e4;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
    color: var(--asphalt);
    background: var(--paper);
  }
  h1, h2, h3, p, ol, ul, dl, dd, figure, fieldset { margin: 0; padding: 0; }
  fieldset { border: 0; min-width: 0; }
  ol, ul { list-style: none; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--carpet); outline-offset: 2px; }
  .on-blue :focus-visible { outline-color: var(--band); }

  .wrap { max-width: 1120px; margin-inline: auto; padding-inline: clamp(1.25rem, 4vw, 2.5rem); }
  .display { font-stretch: 62%; font-weight: 800; line-height: .96; }
  .section-pad { padding-block: clamp(3.5rem, 8vw, 6rem); }
  .section-title { font-size: clamp(2.25rem, 5vw, 3.5rem); margin-bottom: 1.25rem; }
  .lede { max-width: 46ch; }
  .muted { color: var(--muted); }

  /* Buttons */
  .btn {
    display: inline-block; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--band); color: var(--asphalt);
    font-weight: 700; font-size: 1.125rem; text-decoration: none;
    padding: .95rem 1.5rem; line-height: 1.2;
  }
  .btn:hover { background: #ffc85c; }
  .btn[disabled] { opacity: .6; cursor: progress; }
  .btn-quiet {
    background: transparent; color: inherit; border: 1.5px solid currentColor;
    font-size: 1rem; padding: .55rem 1rem;
  }
  .btn-quiet:hover { background: rgba(127, 140, 170, .16); }

  /* Hero */
  .hero {
    background-color: var(--carpet);
    background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.3px);
    background-size: 6px 6px;
    color: #fff;
  }
  .nav { display: flex; align-items: center; gap: 1rem; padding-block: 1.25rem; }
  .brand { font-size: 1.9rem; margin-right: auto; letter-spacing: .01em; }
  .lang { display: flex; border: 1.5px solid rgba(255, 255, 255, .7); border-radius: 8px; overflow: hidden; }
  .lang button { background: transparent; border: 0; color: #fff; padding: .45rem .7rem; font-weight: 600; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--carpet); }
  .hero-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(1.5rem, 4vw, 3rem); align-items: center;
    padding-block: clamp(1.5rem, 4vw, 3rem) clamp(3rem, 7vw, 5rem);
  }
  .hero h1 { font-size: clamp(2.9rem, 7.4vw, 5.75rem); margin-bottom: 1.5rem; }
  .hero .lede { font-size: 1.1875rem; max-width: 40ch; }
  .offer { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1rem; margin-block: 2rem 1.25rem; }
  .offer-now { font-size: 3.25rem; color: var(--band); }
  .offer-was { text-decoration: line-through; opacity: .8; font-size: 1.25rem; }
  .offer-note { font-size: 1.0625rem; }
  .assure { margin-top: 1rem; font-size: .975rem; max-width: 46ch; opacity: .92; }
  .shot-frame { position: relative; border-radius: 14px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot figcaption { font-size: .9rem; opacity: .85; margin-top: .75rem; }
  .tag { position: absolute; width: 0; height: 0; }
  .tag::before { content: ""; position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--band); border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  .tag b { position: absolute; white-space: nowrap; background: #fff; color: var(--asphalt); font-size: .85rem; font-weight: 700; line-height: 1; padding: .4rem .6rem; border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .tag-t b { bottom: 14px; left: 0; transform: translateX(-50%); }
  .tag-b b { top: 14px; left: 0; transform: translateX(-50%); }
  .tag-r b { left: 15px; top: 0; transform: translateY(-50%); }

  /* Mount line: the painted stripe at the T1 exit */
  .mountline { background: var(--paint); color: var(--carpet); }
  .mountline p { font-size: 1.35rem; padding-block: .7rem; letter-spacing: .02em; }

  /* Problem */
  .problem-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(1.5rem, 5vw, 4rem); align-items: start; }
  .problem-grid .section-title { margin-bottom: 0; }

  .steps img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: #dfe4ee; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1.5rem, 3vw, 2.5rem); margin-top: 2.5rem; counter-reset: step; }
  .steps li { counter-increment: step; border-top: 3px solid var(--asphalt); padding-top: 1rem; }
  .steps li::before { content: counter(step); display: block; font-stretch: 62%; font-weight: 800; font-size: 3.5rem; line-height: 1; color: var(--carpet); margin-bottom: .75rem; }
  .steps h3 { font-size: 1.3rem; line-height: 1.25; margin-block: 1.1rem .4rem; }

  /* Kit and bib */
  .kit { background: #fff; }
  .kit-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(2rem, 6vw, 5rem); align-items: center; }
  .kit-list li { padding-block: .9rem; border-bottom: 1px solid var(--rule); max-width: 56ch; }
  .kit-list li:first-child { border-top: 1px solid var(--rule); }
  .bib {
    position: relative; background: var(--paper); border-radius: 16px; overflow: hidden;
    transform: rotate(-2deg); text-align: center;
    box-shadow: 0 1px 0 #c5cbd8, 0 18px 30px -18px rgba(15, 47, 143, .45);
    max-width: 420px; margin-inline: auto;
  }
  .bib-top { background: var(--carpet); color: #fff; padding: 1.4rem 1rem .8rem; font-size: 1.5rem; }
  .bib-number { font-size: clamp(5rem, 14vw, 8.5rem); padding: 1rem .5rem .25rem; }
  .bib-foot { padding: 0 1rem 1.9rem; color: var(--muted); }
  .bib-foot s { color: var(--asphalt); }
  .pin { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45); }
  .pin.tl { top: 10px; left: 12px; } .pin.tr { top: 10px; right: 12px; }
  .pin.bl { bottom: 10px; left: 12px; } .pin.br { bottom: 10px; right: 12px; }
  .kit-cta { margin-top: 2rem; }

  /* Order */
  .order-grid { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: clamp(1.5rem, 4vw, 3rem); align-items: start; margin-top: 2rem; }
  .panel { background: #fff; border-radius: 14px; padding: clamp(1.25rem, 3.5vw, 2.25rem); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem 1.25rem; }
  .field-wide { grid-column: 1 / -1; }
  label, legend { font-weight: 600; display: block; margin-bottom: .35rem; }
  .hint { font-size: .9rem; color: var(--muted); margin-top: .35rem; }
  input[type="text"], input[type="email"], input[type="tel"], select, textarea {
    width: 100%; background: #fff; border: 1.5px solid #8b94a7; border-radius: 8px; padding: .7rem .8rem;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--carpet); }
  .choice { display: flex; gap: .7rem; align-items: flex-start; padding: .8rem .9rem; border: 1.5px solid var(--rule); border-radius: 8px; font-weight: 400; margin-bottom: .5rem; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--carpet); background: #eef2fd; }
  .choice input { margin-top: .3rem; accent-color: var(--carpet); width: 1.05rem; height: 1.05rem; flex: none; }
  .choice strong { display: block; }
  .choice small { color: var(--muted); font-size: .9rem; }
  .trap { position: absolute; left: -9999px; }
  .form-actions { margin-top: 1.5rem; }
  .form-error { color: var(--error); font-weight: 600; margin-top: .75rem; }

  .summary { position: sticky; top: 1.25rem; }
  .summary h3 { font-size: 1.15rem; margin-bottom: .75rem; }
  .summary dl div { display: flex; justify-content: space-between; gap: 1rem; padding-block: .55rem; border-bottom: 1px solid var(--rule); }
  .summary dt { color: var(--muted); }
  .summary dd { font-weight: 600; text-align: right; }
  .summary .total dd { font-size: 1.9rem; }
  .summary .total { border-bottom: 0; align-items: baseline; }

  /* Payment instructions */
  .confirm h3 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin-bottom: .75rem; }
  .pay { margin-block: 1.5rem; border-top: 3px solid var(--asphalt); }
  .pay div { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding-block: .8rem; border-bottom: 1px solid var(--rule); }
  .pay dt { color: var(--muted); }
  .pay dd { font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
  .copy { background: #fff; border: 1.5px solid var(--asphalt); border-radius: 8px; padding: .4rem .8rem; font-weight: 600; font-size: .95rem; cursor: pointer; min-width: 5.5rem; }
  .copy:hover { background: var(--paper); }
  .backup { background: #fff6df; border-left: 5px solid var(--band); padding: 1rem 1.1rem; border-radius: 0 8px 8px 0; margin-block: 1.25rem; }
  .backup .btn { margin-top: .75rem; font-size: 1rem; padding: .7rem 1.1rem; }
  .confirm-actions { margin-top: 1.5rem; }

  footer { background: var(--asphalt); color: #e6e9ef; padding-block: 2.25rem; font-size: .975rem; }
  footer :focus-visible { outline-color: var(--band); }

  @media (max-width: 860px) {
    .hero-grid, .problem-grid, .kit-grid, .order-grid { grid-template-columns: minmax(0, 1fr); }
    .steps { grid-template-columns: minmax(0, 1fr); }
    .summary { position: static; }
    .order-grid .summary { order: -1; }
  }
  @media (max-width: 560px) {
    .tag b { font-size: .75rem; padding: .35rem .5rem; }
    .fields { grid-template-columns: minmax(0, 1fr); }
    .nav .btn-quiet { display: none; }
    .pay div { grid-template-columns: minmax(0, 1fr) auto; }
    .pay dt { grid-column: 1 / -1; margin-bottom: -.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>

/* ------------------------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const store = {
  get(area, key) { try { return window[area].getItem(key); } catch (e) { return null; } },
  set(area, key, val) { try { window[area].setItem(key, val); } catch (e) { /* storage unavailable */ } },
  del(area, key) { try { window[area].removeItem(key); } catch (e) { /* storage unavailable */ } }
};

let lang = "fr";
let order = null;          // the placed order, once the form is submitted
let needsBackup = false;   // true when the order could not be sent to the endpoint
let keptRef = null;        // reference reused when the buyer edits a placed order

function fillForm(o) {
  const f = $("#order-form");
  f.name.value = o.name || ""; f.email.value = o.email || ""; f.phone.value = o.phone || "";
  f.qty.value = String(o.qty || 1); f.delivery.value = o.delivery || "pickup";
  f.address.value = o.address || ""; f.gear.value = o.gear || "";
}

function money(n) {
  return new Intl.NumberFormat(lang === "fr" ? "fr-CA" : "en-CA", { style: "currency", currency: "CAD" }).format(n);
}
function t(key, extra) {
  const vars = Object.assign({
    brand: CONFIG.brand, payee: CONFIG.payeeName, email: CONFIG.interacEmail,
    price: money(CONFIG.price), regular: money(CONFIG.regularPrice)
  }, extra);
  const str = I18N[lang][key];
  return typeof str === "string" ? str.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : str;
}

function formValues() {
  const f = $("#order-form");
  const qty = Math.max(1, Math.min(CONFIG.maxQty, parseInt(f.qty.value, 10) || 1));
  return {
    name: f.name.value.trim(), email: f.email.value.trim(), phone: f.phone.value.trim(),
    qty, total: Math.round(qty * CONFIG.price * 100) / 100,
    delivery: f.delivery.value, address: f.address.value.trim(), gear: f.gear.value.trim()
  };
}

function render() {
  document.documentElement.lang = lang;
  document.title = t("page.title");
  $$("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $$("[data-i18n-alt]").forEach(el => { el.alt = t(el.dataset.i18nAlt); });
  $$("[data-brand]").forEach(el => { el.textContent = CONFIG.brand; });
  $$("[data-price]").forEach(el => { el.textContent = money(CONFIG.price); });
  $$("[data-regular]").forEach(el => { el.textContent = money(CONFIG.regularPrice); });
  $$("[data-payee]").forEach(el => { el.textContent = CONFIG.payeeName; });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const mail = $("#footer-mail");
  mail.textContent = CONFIG.interacEmail;
  mail.href = "mailto:" + CONFIG.interacEmail;
  renderSummary();
  if (order) renderConfirm();
}

function renderSummary() {
  const v = order || formValues();
  $("#s-qty").textContent = "× " + v.qty;
  $("#s-delivery").textContent = t("s.delivery." + v.delivery);
  $("#s-total").textContent = money(v.total);
  $("#address-field").hidden = formValues().delivery !== "shipping";
}

function mailtoLink(o) {
  const L = t("mail.labels");
  const rows = [o.ref, o.name, o.email, o.phone, o.qty, money(o.total), t("s.delivery." + o.delivery), o.address, o.gear];
  const body = rows.map((val, i) => L[i] + " : " + (val || "-")).join("\n");
  return "mailto:" + CONFIG.interacEmail +
    "?subject=" + encodeURIComponent(t("mail.subject", { ref: o.ref })) +
    "&body=" + encodeURIComponent(body);
}

function renderConfirm() {
  $("#pay-email").textContent = CONFIG.interacEmail;
  $("#pay-phone").textContent = CONFIG.interacPhone;
  $("#pay-phone-row").hidden = !CONFIG.interacPhone;
  $("#pay-amount").textContent = money(order.total);
  $("#pay-ref").textContent = order.ref;
  $("#c-next").textContent = t("c.next", { buyer: order.email });
  $("#backup").hidden = !needsBackup;
  $("#backup-link").href = mailtoLink(order);
}

function showConfirm(focus) {
  $("#order-form").hidden = true;
  $("#confirm").hidden = false;
  renderConfirm();
  renderSummary();
  if (focus) {
    $("#confirm").focus({ preventScroll: true });
    $("#commande").scrollIntoView({ block: "start" });
  }
}

function newRef() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = new Uint8Array(5);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  return "T1-" + Array.from(bytes, b => alphabet[b % alphabet.length]).join("");
}

function validate(v, f) {
  if (!v.name || !v.email) return "err.required";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return "err.email";
  if (v.delivery === "shipping" && !v.address) return "err.address";
  if (!f.ack.checked) return "err.ack";
  return null;
}

async function sendOrder(o) {
  if (!CONFIG.orderEndpoint) return false;
  const data = new URLSearchParams();
  Object.keys(o).forEach(k => data.append(k, o[k]));
  data.append("lang", lang);
  try {
    // "no-cors" lets a static page post to a Google Apps Script web app.
    await fetch(CONFIG.orderEndpoint, { method: "POST", mode: "no-cors", body: data });
    return true;
  } catch (e) {
    return false;
  }
}

$("#order-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.currentTarget;
  const v = formValues();
  const err = validate(v, f);
  const box = $("#form-error");
  if (err) { box.textContent = t(err); box.hidden = false; return; }
  box.hidden = true;

  const btn = $("#submit-btn");
  btn.disabled = true;
  btn.textContent = t("f.sending");
  const placed = Object.assign({ ref: keptRef || newRef() }, v);
  const sent = f.website.value ? true : await sendOrder(placed);
  btn.disabled = false;
  btn.textContent = t("f.submit");

  order = placed;
  needsBackup = !sent;
  store.set("sessionStorage", "t1go-order", JSON.stringify({ order, needsBackup }));
  showConfirm(true);
});

$("#order-form").addEventListener("input", renderSummary);
$("#order-form").addEventListener("change", renderSummary);

$("#edit-order").addEventListener("click", () => {
  keptRef = order.ref;                 // a corrected order keeps the same reference
  fillForm(order);
  order = null;
  store.del("sessionStorage", "t1go-order");
  $("#confirm").hidden = true;
  $("#order-form").hidden = false;
  renderSummary();
  $("#f-name").focus();
});

$$(".copy").forEach(btn => btn.addEventListener("click", async () => {
  const values = {
    email: CONFIG.interacEmail, phone: CONFIG.interacPhone,
    amount: order ? order.total.toFixed(2) : "", ref: order ? order.ref : ""
  };
  const text = values[btn.dataset.copy];
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* nothing more to try */ }
    ta.remove();
  }
  btn.textContent = t("c.copied");
  setTimeout(() => { btn.textContent = t("c.copy"); }, 1600);
}));

$$(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  store.set("localStorage", "t1go-lang", lang);
  render();
}));

(function init() {
  const qty = $("#f-qty");
  for (let i = 1; i <= CONFIG.maxQty; i++) qty.add(new Option(String(i), String(i)));

  const fromUrl = new URLSearchParams(location.search).get("lang");
  const saved = store.get("localStorage", "t1go-lang");
  lang = [fromUrl, saved, "fr"].find(l => l === "fr" || l === "en");

  const savedOrder = store.get("sessionStorage", "t1go-order");
  if (savedOrder) {
    try {
      const parsed = JSON.parse(savedOrder);
      if (parsed && parsed.order && parsed.order.ref) { order = parsed.order; needsBackup = !!parsed.needsBackup; }
    } catch (e) { /* ignore a corrupt entry */ }
  }
  render();
  if (order) showConfirm(false);
})();
</script>
</body>
</html>
